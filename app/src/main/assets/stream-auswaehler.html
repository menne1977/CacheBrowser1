<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Auswähler &amp; Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            max-width: 700px;
            margin: 20px auto;
            padding: 15px;
        }
        h2 {
            font-size: 0.95rem;
            font-weight: 500;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .box {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #383838;
            border-radius: 4px;
            cursor: pointer;
            box-sizing: border-box;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-action {
            background: #0088a9;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-action:hover {
            background: #00a8cc;
        }
        .btn-secondary {
            background: #333;
            margin-right: 5px;
        }
        .btn-secondary:hover {
            background: #444;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        li {
            padding: 8px 10px;
            background: #202020;
            margin-bottom: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
        }
        li input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .file-info {
            cursor: pointer;
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-name {
            font-size: 0.9rem;
            display: block;
        }
        .file-size {
            font-size: 0.75rem;
            color: #777;
        }
        li.active {
            background: #1f3a40;
            border-color: #0088a9;
        }
    </style>
</head>
<body>

    <h2>1. Streams auswählen</h2>
    <div class="box">
        <input type="file" id="folderInput" accept="audio/*,.mp3,.aac,.m4a,.wav,.m3u8,.ts" multiple>
    </div>

    <h2>2. Aktiver Player</h2>
    <div class="box">
        <audio id="audioPlayer" controls></audio>
    </div>

    <h2>3. Verfügbare Streams (<span id="fileCount">0</span>)</h2>
    <div class="box">
        <div class="toolbar">
            <div>
                <button class="btn-action btn-secondary" id="selectAll">Alle wählen</button>
                <button class="btn-action btn-secondary" id="deselectAll">Keine</button>
            </div>
            <button class="btn-action" id="downloadSelected">Ausgewählte speichern (0)</button>
        </div>
        <div id="status" style="font-size:0.8rem;color:#a0d8ef;margin-bottom:6px;min-height:1em;"></div>
        <ul id="playlist">
            <li style="color: #666; text-align: center; display: block; cursor: default;">Noch keine Dateien ausgewählt</li>
        </ul>
    </div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const playlist = document.getElementById('playlist');
        const fileCount = document.getElementById('fileCount');
        const downloadSelectedBtn = document.getElementById('downloadSelected');
        const selectAllBtn = document.getElementById('selectAll');
        const deselectAllBtn = document.getElementById('deselectAll');

        let fileMap = new Map(); // Speichert Datei-Objekte verknüpft mit ihrer Checkbox

        folderInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files).filter(file => {
                const name = file.name.toLowerCase();
                return name.endsWith('.mp3') || 
                       name.endsWith('.aac') || 
                       name.endsWith('.m3u8') || 
                       name.endsWith('.ts') || 
                       name.endsWith('.m4a') || 
                       name.endsWith('.wav') ||
                       file.type.includes('audio');
            });

            playlist.innerHTML = '';
            fileMap.clear();
            fileCount.textContent = files.length;
            updateDownloadCount();

            if (files.length === 0) {
                playlist.innerHTML = '<li style="color: #666; text-align: center; display: block;">Keine kompatiblen Stream-Dateien gewählt</li>';
                return;
            }

            files.sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));

            files.forEach((file) => {
                const li = document.createElement('li');

                // Checkbox für die Auswahl
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.onchange = updateDownloadCount;

                // Datei-Infos (Name + Größe)
                const infoDiv = document.createElement('div');
                infoDiv.className = 'file-info';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name';
                nameSpan.textContent = file.webkitRelativePath || file.name;
                
                const sizeSpan = document.createElement('span');
                sizeSpan.className = 'file-size';
                sizeSpan.textContent = (file.size / 1024).toFixed(1) + ' KB';

                infoDiv.appendChild(nameSpan);
                infoDiv.appendChild(sizeSpan);

                // Klick auf den Text spielt den Stream ab
                infoDiv.onclick = function() {
                    document.querySelectorAll('li').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    
                    const fileURL = URL.createObjectURL(file);
                    audioPlayer.src = fileURL;
                    audioPlayer.play().catch(err => console.error("Wiedergabefehler:", err));
                };

                li.appendChild(checkbox);
                li.appendChild(infoDiv);
                playlist.appendChild(li);

                // In Map speichern für den Download-Button
                fileMap.set(checkbox, file);
            });
        });

        function updateDownloadCount() {
            let checkedCount = 0;
            fileMap.forEach((file, checkbox) => {
                if (checkbox.checked) checkedCount++;
            });
            downloadSelectedBtn.textContent = `Ausgewählte speichern (${checkedCount})`;
        }

        selectAllBtn.onclick = function() {
            fileMap.forEach((file, checkbox) => { checkbox.checked = true; });
            updateDownloadCount();
        };

        deselectAllBtn.onclick = function() {
            fileMap.forEach((file, checkbox) => { checkbox.checked = false; });
            updateDownloadCount();
        };

        const statusEl = document.getElementById('status');

        // Ausgewählte Dateien speichern (in der App über die Bridge, sonst klassischer Download)
        downloadSelectedBtn.onclick = async function() {
            const selectedFiles = [];
            fileMap.forEach((file, checkbox) => {
                if (checkbox.checked) selectedFiles.push(file);
            });

            if (selectedFiles.length === 0) {
                statusEl.textContent = "Bitte wähle mindestens eine Datei aus!";
                return;
            }

            if (window.DTM && DTM.saveChunk) {
                const CH = 3 * 1024 * 1024;
                for (let n = 0; n < selectedFiles.length; n++) {
                    const file = selectedFiles[n];
                    statusEl.textContent = `Speichere ${n + 1}/${selectedFiles.length}: ${file.name}`;
                    let first = true;
                    for (let off = 0; off < file.size || first; off += CH) {
                        const buf = new Uint8Array(await file.slice(off, off + CH).arrayBuffer());
                        let bin = '';
                        for (let i = 0; i < buf.length; i += 0x8000) {
                            bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
                        }
                        DTM.saveChunk(file.name, btoa(bin), first);
                        first = false;
                    }
                }
                statusEl.textContent = `${selectedFiles.length} Datei(en) gespeichert (Downloads-Ordner der App)`;
                return;
            }

            selectedFiles.forEach((file, index) => {
                // Kleiner zeitlicher Versatz, damit der Browser mehrere Downloads nicht verschluckt
                setTimeout(() => {
                    const a = document.createElement('a');
                    const url = URL.createObjectURL(file);
                    a.href = url;
                    a.download = (file.name || 'stream').split('/').pop();
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 10000);
                }, index * 300);
            });
        };
    </script>

</body>
</html>
